<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#02060d">
<title>The System</title>
<meta name="application-name" content="The System">
<meta name="description" content="A real-life leveling system: quests, skills, jobs and shadows.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The System">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --b:#2f8cff; --b2:#8fc8ff; --bg:#02060d; --txt:#e9f4ff; --dim:rgba(170,205,255,.62);
  --glow:rgba(47,140,255,.9); --red:#ff4a4a; --green:#7ed321;
  --ui:'Source Sans 3','Myriad Pro','Segoe UI',Roboto,sans-serif;
  --hd:'Bebas Neue','Oswald','Arial Narrow',Impact,'sans-serif-condensed',sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-theme=purple]{--b:#a64dff;--b2:#d9b0ff;--glow:rgba(166,77,255,.95);--dim:rgba(215,185,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:
  radial-gradient(90% 60% at 50% 0%,rgba(20,60,120,.28),transparent 70%),radial-gradient(80% 50% at 50% 100%,rgba(10,40,90,.25),transparent 70%),var(--bg)}
body[data-theme=purple] #app{background:radial-gradient(90% 60% at 50% 0%,rgba(90,30,150,.28),transparent 70%),radial-gradient(80% 50% at 50% 100%,rgba(60,20,110,.25),transparent 70%),var(--bg)}
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}
#cmd{display:flex;gap:6px;padding:6px 10px;background:rgba(2,8,16,.92);align-items:center;position:relative}
#cmd.hide,#nav.hide{display:none}
#cmd input{flex:1;height:36px;background:rgba(0,12,28,.8);border:1px solid color-mix(in srgb,var(--b) 60%,transparent);color:#fff;font:inherit;font-size:15px;padding:0 10px;border-radius:0;outline:none;user-select:text;-webkit-user-select:text}
#cmd input:focus{border-color:#fff;box-shadow:0 0 10px var(--glow)}
#cmd button{width:42px;height:36px;border:1px solid color-mix(in srgb,var(--b) 60%,transparent);display:flex;align-items:center;justify-content:center;background:rgba(5,20,40,.7)}
#cmd button svg{width:18px;height:18px}
#cmdfb{position:absolute;left:12px;right:12px;bottom:46px;text-align:center;font-size:14px;color:var(--b2);text-shadow:0 0 8px var(--glow);pointer-events:none;opacity:0;transition:opacity .25s}
#cmdfb.on{opacity:1}
#nav{display:flex;border-top:1px solid color-mix(in srgb,var(--b) 55%,transparent);background:rgba(2,8,16,.9)}
#nav button{flex:1;height:50px;font-family:var(--hd);font-size:19px;letter-spacing:2px;color:var(--dim);position:relative}
#nav button.on{color:#fff;text-shadow:0 0 10px var(--glow),0 0 2px #fff}
#nav button.on::after{content:"";position:absolute;left:22%;right:22%;top:-1px;height:2px;background:var(--b2);box-shadow:0 0 10px var(--glow)}
.badge{display:inline-block;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-family:var(--ui);font-size:11px;font-weight:700;line-height:17px;text-align:center;margin-left:4px;vertical-align:3px;box-shadow:0 0 8px rgba(255,60,60,.8);letter-spacing:0}

/* ---------- shared tech panels ---------- */
.fit{position:absolute;left:50%;top:50%;transform-origin:center center}
.lf{background:linear-gradient(135deg,#041224,#020912 60%,#041a33);color:var(--txt);font-family:var(--ui);overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b) 70%,transparent)}
.lf::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(118deg,transparent 0 22px,rgba(130,190,255,.055) 22px 23px),
  radial-gradient(55% 45% at 18% 22%,color-mix(in srgb,var(--b) 24%,transparent),transparent),
  radial-gradient(55% 45% at 82% 80%,color-mix(in srgb,var(--b) 20%,transparent),transparent)}
.lf-bar{position:absolute;left:4%;right:4%;height:11px;background:linear-gradient(90deg,transparent,var(--b) 5%,var(--b2) 50%,var(--b) 95%,transparent);box-shadow:0 0 14px var(--glow);clip-path:polygon(2% 0,98% 0,100% 100%,0 100%);animation:flick 7s infinite}
.lf-bar.t{top:5px}.lf-bar.b{bottom:5px;transform:scaleY(-1)}
.lf-side{position:absolute;top:10%;bottom:10%;width:5px;background:var(--b);box-shadow:0 0 12px var(--glow);opacity:.8}
.lf-side.l{left:4px}.lf-side.r{right:4px}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
@keyframes sysIn{0%{clip-path:inset(49.6% 0 49.6% 0);opacity:0}25%{clip-path:inset(49.6% 0 49.6% 0);opacity:1}100%{clip-path:inset(0 0 0 0)}}
@keyframes sysOut{0%{clip-path:inset(0 0 0 0);opacity:1}55%{clip-path:inset(49.6% 0 49.6% 0);opacity:1}100%{clip-path:inset(49.6% 0 49.6% 0);opacity:0}}
@keyframes gl{0%,100%{filter:none;translate:0 0}7%{filter:brightness(1.9) hue-rotate(25deg);translate:4px 0}15%{filter:none;translate:-4px 1px}23%{filter:brightness(1.5);translate:2px 0}31%{filter:none;translate:0 0}}
.open{animation:sysIn .5s cubic-bezier(.2,.8,.2,1)}
.closing{animation:sysOut .22s forwards}
@keyframes shake{0%,100%{translate:0}20%{translate:-8px}40%{translate:7px}60%{translate:-5px}80%{translate:3px}}
.shake{animation:shake .35s}

/* ---------- STATUS ---------- */
.st{position:absolute;inset:30px 40px;border:1px solid rgba(255,255,255,.82);background:rgba(0,10,24,.55);text-shadow:0 0 8px var(--glow)}
.st-title{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:230px;height:44px;border:1px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;letter-spacing:7px;padding-left:7px}
.st-head{position:absolute;top:68px;left:0;right:0;height:96px;display:flex;align-items:center;justify-content:center;gap:30px}
.st-lv{text-align:center;line-height:1}
.st-lv b{display:block;font-size:84px;font-weight:600;letter-spacing:-2px;text-shadow:0 0 16px var(--glow),0 0 3px #fff}
.st-lv small{display:block;font-size:17px;letter-spacing:3px;margin-top:2px}
.st-jt{font-size:12px;line-height:1.7;letter-spacing:.5px;max-width:250px}
.st-jt span{opacity:.85;font-size:11px}.st-jt b{font-size:16px;font-weight:600}
.st-b1,.st-b2{position:absolute;left:50%;transform:translateX(-50%);width:640px;border:1px solid rgba(255,255,255,.72)}
.st-b1{top:172px;height:78px;display:flex;align-items:center;padding:0 20px;gap:26px}
.st-b2{top:262px;height:112px;display:grid;grid-template-columns:1fr 1fr;padding:6px 40px}
.bg{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bg svg{width:24px;height:24px;flex:none;filter:drop-shadow(0 0 5px var(--glow))}
.bg .col{flex:1}
.bar{height:15px;border:2px solid rgba(255,255,255,.92);border-radius:9px;padding:2px;box-shadow:0 0 8px var(--glow)}
.bar i{display:block;height:100%;border-radius:6px;background:#fff;box-shadow:0 0 8px var(--glow);transition:width .5s}
.bg .num{font-size:10px;text-align:right;margin-top:3px;opacity:.9}
.fat{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.fat svg{width:26px;height:26px}
.sc{display:flex;flex-direction:column;justify-content:space-around}
.sr{display:flex;align-items:center;gap:10px;font-size:19px;height:32px}
.sr svg{width:24px;height:24px;filter:drop-shadow(0 0 5px var(--glow))}
.sr .l{min-width:58px;font-weight:600;letter-spacing:1px}
.sr .v{min-width:34px;font-weight:600}
.sr em{font-style:normal;font-size:12px;color:#39ff5a;text-shadow:0 0 6px #1ecb3e}
.plus{width:24px;height:24px;border:1px solid #fff;border-radius:3px;font-size:18px;line-height:20px;text-align:center;background:rgba(255,255,255,.12);box-shadow:0 0 8px var(--glow)}
.plus:active{background:rgba(255,255,255,.4)}
.ap{display:flex;align-items:center;gap:8px;height:42px}
.ap b{font-size:40px;font-weight:600;line-height:1}
.ap small{font-size:8px;line-height:1.2;max-width:42px;opacity:.9}
.rotbtn{position:absolute;right:12px;top:12px;z-index:4;font-size:11px;letter-spacing:1.5px;border:1px solid color-mix(in srgb,var(--b) 70%,transparent);padding:5px 9px;color:var(--dim);background:rgba(2,8,16,.7)}

/* ---------- Portrait chamfered frame ---------- */
.tfw{position:relative;flex:1;min-height:0;filter:drop-shadow(0 0 7px var(--glow));width:100%;max-width:520px;margin:0 auto}
.tfw::before,.tfw::after{content:"";position:absolute;top:36%;height:26%;width:9px;background:linear-gradient(var(--b2),var(--b));box-shadow:0 0 14px var(--glow);z-index:2;border-radius:2px}
.tfw::before{left:-3px}.tfw::after{right:-3px}
.tfo,.tfi{position:absolute;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.tfo{inset:0;--c:24px;background:linear-gradient(180deg,var(--b2),var(--b) 30%,var(--b) 70%,var(--b2))}
.tfi{inset:3px;--c:21px;background:linear-gradient(160deg,#03101f,#010509 55%,#04172c);overflow:hidden}
.tfi::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,transparent 0 20px,rgba(130,190,255,.05) 20px 21px),radial-gradient(70% 40% at 20% 20%,color-mix(in srgb,var(--b) 22%,transparent),transparent),radial-gradient(70% 40% at 80% 85%,color-mix(in srgb,var(--b) 22%,transparent),transparent);pointer-events:none}
.qp{position:absolute;inset:7% 8% 6%;border:1px solid rgba(255,255,255,.42);display:flex;flex-direction:column;padding:0 14px 14px;text-shadow:0 0 8px var(--glow)}
.qh{display:flex;margin:-1px -15px 0 -15px;height:46px;flex:none}
.qh .ic{width:46px;border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;margin-right:-1px}
.qh .ic svg{width:30px;height:30px}
.qh .ti{flex:1;border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;letter-spacing:5px;padding-left:5px;text-align:center}
.qmsg{text-align:center;font-size:15px;margin:16px 0 4px;line-height:1.35}
.qnote{text-align:center;font-size:12px;color:var(--dim);text-shadow:none;margin:2px 0 0;line-height:1.4}
.qgoal{text-align:center;font-size:25px;font-weight:600;letter-spacing:2px;margin:16px 0 10px;border-bottom:3px double rgba(255,255,255,.95);align-self:center;padding:0 2px 1px;line-height:1.1}
.goals{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:4px 2px}
.goals>.goal:first-child{margin-top:auto}.goals>.goal:last-child{margin-bottom:auto}
.goal{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px;padding:9px 4px;cursor:pointer;border-radius:3px}
.goal:active{background:rgba(255,255,255,.1)}
.goal.lock{cursor:default;opacity:.8}
.gv{display:flex;align-items:center;gap:14px;font-size:16px;white-space:nowrap}
.cb{display:inline-flex;width:20px;height:20px;border:1.5px solid #fff;border-radius:4px;align-items:center;justify-content:center;font-style:normal;font-size:14px;box-shadow:0 0 8px var(--glow);flex:none}
.goal.ok .cb,.tgl.on .cb{background:rgba(255,255,255,.9);color:#021;text-shadow:none}
.warn{text-align:center;font-size:15px;line-height:1.55;margin-top:8px;min-height:20px}
.tl{text-align:center;font-size:15px;letter-spacing:2px;margin-top:6px;font-weight:600}
.tl.y{color:#ffe066}.tl.o{color:#ffa94d}.tl.r{color:#ff5a5a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.qctl{display:flex;gap:6px;align-items:center;justify-content:center;margin:10px auto 0;width:100%;max-width:520px;font-size:13px;letter-spacing:1.2px;color:var(--dim);flex-wrap:wrap}
.qctl button{border:1px solid color-mix(in srgb,var(--b) 70%,transparent);padding:8px 11px;color:#fff;background:rgba(5,20,40,.7);font-weight:600}
.qctl button:active{background:color-mix(in srgb,var(--b) 40%,transparent)}
.logp{overflow:auto;flex:1;min-height:0;margin-top:10px;font-size:14px;line-height:1.5;padding-right:4px;-webkit-overflow-scrolling:touch}
.logp::-webkit-scrollbar{width:4px}.logp::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6)}
.kv{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.kv b{font-weight:600}
.xp{margin:8px 0 12px}
.hl{margin:12px 0 4px;font-size:16px;font-weight:600;letter-spacing:3px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:3px}
.he{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.he time{color:var(--dim);flex:none;width:78px}
.he.neg span{color:#ff8a8a}
.btnbox{display:inline-block;min-width:96px;height:36px;border:1px solid rgba(255,255,255,.85);text-align:center;line-height:34px;font-size:15px;font-weight:600;background:rgba(0,10,25,.6);padding:0 14px}
.btnbox:active{background:rgba(255,255,255,.25)}
.lr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:16px}
.lr:active{background:rgba(255,255,255,.1)}
.lr .lt{flex:1;min-width:0}
.lr small{display:block;font-size:12px;color:var(--dim);margin-top:2px;text-shadow:none;font-weight:400}
.lr.lk{opacity:.55}
.tag{flex:none;border:1px solid rgba(255,255,255,.6);padding:2px 8px;font-size:12px;letter-spacing:1px;font-weight:600}
.tag.g{border-color:#7aff9a;color:#7aff9a}.tag.y{border-color:#ffe066;color:#ffe066}.tag.r{border-color:#ff7a7a;color:#ff7a7a}
.tabs{display:flex;margin:10px 0 4px;flex:none}
.tabs button{flex:1;padding:8px 0;border:1px solid rgba(255,255,255,.45);margin-left:-1px;font-size:12px;letter-spacing:.8px;font-weight:600;color:var(--dim)}
.tabs button.on{background:rgba(255,255,255,.88);color:#021;text-shadow:none}
.sub{font-size:13px;color:var(--dim);text-shadow:none;margin:8px 0 2px;line-height:1.45}
.msgb{white-space:pre-line;font-size:15px;line-height:1.55;text-align:left;margin:4px 0 6px;text-shadow:none}

/* ---------- Notification dialogs ---------- */
.np{position:absolute;inset:26px 38px;border:1px solid rgba(255,255,255,.7);background:rgba(0,10,24,.6);text-shadow:0 0 8px var(--glow);display:flex;flex-direction:column;padding:0 0 14px}
.nh{display:flex;height:40px;margin:14px 0 0 18px;flex:none}
.nicon{width:40px;border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.nicon svg{width:26px;height:26px}
.ntitle{width:220px;margin-left:-1px;border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;letter-spacing:4px;padding-left:4px}
.nb{flex:1;min-height:0;overflow:auto;padding:12px 26px}
.nb.c{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:23px;line-height:1.55;font-weight:700}
.nb.c>div:first-child{margin-top:auto}.nb.c>div:last-child{margin-bottom:auto}
.nb.it{font-style:italic}.nb.dg{color:#ff9c9c;text-shadow:0 0 8px rgba(255,60,60,.8)}
.nb.l{font-size:19px;line-height:1.8;display:flex;flex-direction:column;justify-content:center}
.rd{color:var(--red);text-shadow:0 0 8px rgba(255,40,40,.8)}
.nbtns{display:flex;justify-content:space-around;padding:0 70px;flex:none}
.nbtn{width:84px;height:38px;border:1px solid rgba(255,255,255,.85);font-size:18px;font-weight:600;background:rgba(0,10,25,.6);text-shadow:0 0 8px var(--glow)}
.nbtn:active{background:rgba(255,255,255,.28)}

/* ---------- Portrait dialogs ---------- */
#ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,3,8,.78);backdrop-filter:blur(2px)}
#ov.on{display:block}
.ovstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pd{width:min(92vw,430px);max-height:96%;overflow:auto;margin:auto;padding:24px 22px 26px;text-align:center;font-family:var(--ui);color:var(--txt);text-shadow:0 0 8px var(--glow);border:1px solid rgba(255,255,255,.5);background:
  repeating-linear-gradient(118deg,transparent 0 22px,rgba(130,190,255,.05) 22px 23px),linear-gradient(170deg,#06182c,#020a14 60%,#051d38);box-shadow:inset 0 3px 0 var(--b),inset 0 -3px 0 var(--b),0 0 26px var(--glow)}
.pd-title{display:inline-block;border:1px solid rgba(255,255,255,.6);padding:9px 28px;font-size:21px;font-weight:600;letter-spacing:4px;margin-bottom:20px;max-width:100%}
.pd p{font-size:17px;margin:14px 0}
.pd-list{border:1px solid rgba(255,255,255,.55);padding:16px 22px;margin:22px auto}
.pd-list div{border:1px solid rgba(255,255,255,.55);padding:7px 10px;font-size:17px;margin:7px 0;letter-spacing:.5px}
.pd-btns{display:flex;justify-content:space-around;margin-top:26px;gap:10px;flex-wrap:wrap}
.pd-btns .btnbox{min-width:110px}
.pd label{display:block;text-align:left;font-size:12px;letter-spacing:2px;margin:14px 0 5px;color:var(--dim)}
.pd input,.pd select{width:100%;height:40px;background:rgba(0,12,28,.8);border:1px solid rgba(255,255,255,.55);color:#fff;font:inherit;font-size:16px;padding:0 10px;border-radius:0;outline:none;user-select:text;-webkit-user-select:text}
.pd input:focus{border-color:#fff;box-shadow:0 0 10px var(--glow)}
.pd input[type=date]{color-scheme:dark}
.gr{display:grid;grid-template-columns:1fr 70px 56px 34px;gap:6px;margin-bottom:6px}
.seg{display:flex}
.seg button{flex:1;height:38px;border:1px solid rgba(255,255,255,.5);margin-left:-1px;font-weight:600;font-size:15px}
.seg button.on{background:rgba(255,255,255,.88);color:#021;text-shadow:none}
.tgl{display:flex;align-items:center;gap:10px;text-align:left;font-size:15px;margin-top:16px;cursor:pointer}
.msg{color:#ff9c9c;font-size:14px;min-height:18px;margin-top:10px}
.small{font-size:13px;color:var(--dim)}
.pd .kvl{display:flex;justify-content:space-between;font-size:15px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;gap:12px}
.pd .kvl span:last-child{text-align:right}
.pd .desc{font-size:15px;line-height:1.5;text-align:left;margin:12px 0;text-shadow:none}

/* ---------- Ornate windows ---------- */
.orn{position:relative;width:100%;height:100%;font-family:var(--hd);display:flex;flex-direction:column;padding-top:48px;color:#fff}
.orn.blue{--oc:#7fd6ff;background:linear-gradient(#2d72b4,#235f9c);box-shadow:0 0 30px 6px rgba(40,160,255,.8),inset 0 0 0 2px rgba(120,210,255,.55)}
.orn.gold{--oc:#f0b73a;background:linear-gradient(#5e341b,#3a1d0e 70%,#44240f);box-shadow:0 0 26px 4px rgba(255,170,40,.4),inset 0 0 0 2px rgba(240,183,58,.55)}
.cn{position:absolute;width:64px;height:50px;color:var(--oc);filter:drop-shadow(0 0 4px var(--oc))}

/* ---------- conditions (progression rules) ---------- */
function metric(k){
  const P=S.perf;
  switch(k){
   case 'lv':return S.level;case 'str':case 'agi':case 'per':case 'vit':case 'int':return S.stats[k];
   case 'ph':case 'st':case 'rd':case 'mi':return P[k];
   case 'done':return S.totals.done;case 'streak':return (S.lastDay===dayKey()||S.lastDay===dayKey(new Date(Date.now()-864e5)))?(S.streak||0):0;case 'best':return S.best||0;case 'fails':return S.totals.failed;
   case 'clean':return Math.floor((Date.now()-(S.lastFail||S.startedAt))/864e5);
   case 'days':return Math.floor((Date.now()-S.startedAt)/864e5);
   case 'chains':return Object.values(S.ch).filter(c=>c.done).length;
   case 'shadows':return S.shadows.length;case 'titles':return S.tt.length;case 'skills':return Object.keys(S.sk).length;
   case 'bal':return Math.min(P.ph,P.st,P.rd,P.mi);
   case 'merged':return S.merged?1:0;
   case 'bosses':return S.bossWins||0;case 'floor':return Math.max(0,((S.castle&&S.castle.floor)||1)-1);case 'trial':return 'EDCBAS'.indexOf(S.hr||'E');
  }return 0;
}
function cond(str){
  if(!str)return true;
  return str.split('&').every(p=>{
    if(p.startsWith('c:'))return !!(S.ch[p.slice(2)]&&S.ch[p.slice(2)].done);
    const m=p.match(/^(\w+)(>=|<=|==|>|<)(\d+)$/);if(!m)return false;
    const v=metric(m[1]),n=+m[3];
    return m[2]==='>='?v>=n:m[2]==='<='?v<=n:m[2]==='=='?v===n:m[2]==='>'?v>n:v<n;

}

function addFx(){}
function bolt(w,h){
  const e=Math.floor(Math.random()*4);let x,y,tx,ty;
  if(e===0){x=Math.random()*w;y=0;}else if(e===1){x=w;y=Math.random()*h;}else if(e===2){x=Math.random()*w;y=h;}else{x=0;y=Math.random()*h;}
  tx=w*(.25+Math.random()*.5);ty=h*(.25+Math.random()*.5);
  const pts=[[x,y]],n=6+Math.floor(Math.random()*5),f=.35+Math.random()*.3;
  for(let i=1;i<=n;i++){const k=i/n*f;pts.push([x+(tx-x)*k+(Math.random()-.5)*26,y+(ty-y)*k+(Math.random()-.5)*26]);}
  return {pts,life:4};
}

function drawFx(c,col,col2){
  const p=c.parentElement;if(!p||!p.isConnected)return;
  const w=p.clientWidth,h=p.clientHeight;if(!w||!h)return;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  const x=c.getContext('2d');x.clearRect(0,0,w,h);x.lineJoin='round';
  x.shadowBlur=8;x.shadowColor=col;x.strokeStyle=col2;x.lineWidth=1.2;x.globalAlpha=.55;
  const edge=(ax,ay,bx,by,nx,ny)=>{const L=Math.hypot(bx-ax,by-ay),n=Math.ceil(L/14);x.beginPath();for(let i=0;i<=n;i++){const t=i/n,o=Math.random()*5;const px=ax+(bx-ax)*t+nx*o,py=ay+(by-ay)*t+ny*o;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();};
  edge(0,1,w,1,0,1);edge(0,h-1,w,h-1,0,-1);edge(1,0,1,h,1,0);edge(w-1,0,w-1,h,-1,0);
  c._b=c._b||[];if(Math.random()<.14)c._b.push(bolt(w,h));

/* =========================================================
   LAYOUT FIT
   ========================================================= */
function fitAll(){
  document.querySelectorAll('.fit').forEach(el=>{
    const p=el.parentElement,sw=p.clientWidth,sh=p.clientHeight,W=+el.dataset.w,H=+el.dataset.h;
    const rot=el.dataset.rot==='1'&&sh>sw&&S.rot;
    let s=rot?Math.min(sw/H,sh/W):Math.min(sw/W,sh/H);s=Math.min(s,1.7);
    el.style.width=W+'px';el.style.height=H+'px';
    el.style.transform='translate(-50%,-50%) rotate('+(rot?-90:0)+'deg) scale('+s+')';
  });
}
addEventListener('resize',fitAll);

const has=id=>!!S.sk[id];

  return s.t==='p'?Math.min(s.max,1+Math.floor((S.level-r.at)/s.per)):Math.min(s.max,1+Math.floor((r.uses||0)/s.step));};

function shadowExp(dom){let m=0;S.shadows.forEach(id=>{const s=SHADOWS.find(x=>x.id===id);if(s){m+=(s.fx.all||0)+(s.fx[dom]||0);}});return m;}
function expMult(dom){
  let m=1;
  if(has('adapt'))m+=skL('adapt')*.02;
  const pm={ph:['dagger',.03],st:['scholar',.04],rd:['scholar',.04],mi:['clarity',.04]}[dom];
  if(pm&&has(pm[0]))m+=skL(pm[0])*pm[1];
  if(has('discipline'))m+=Math.min(metric('streak'),30)*.005;
  m+=shadowExp(dom);
  m+=gfx('all')+(dom?gfx(dom):0)+auraNow()*.002;

  return m;

  while(S.level<100&&S.exp>=need(S.level)){S.exp-=need(S.level);S.level++;S.pts+=5;log('Leveled up! Level '+S.level);}

  const b=buffsNow().find(x=>x.id===id);if(b)return{k:'active',left:b.until-n};
  if(r.cd&&r.cd>n)return{k:'cd',left:r.cd-n};return{k:'ready'};}
const mmss=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+pad(m)+'m':pad(m)+':'+pad(s%60);};
async function useSkill(id){
  const s=SKM[id],r=S.sk[id],L=skL(id),st=skillState(id);

function rollLoot(){
  const r=Math.random();
  if(r<.06){addItem('demonbox',1);return 'DEMON LOOT BOX';}
  if(r<.28){const e=Math.round(need(S.level)*(.03+Math.random()*.07));addExp(e);return 'EXP +'+e;}
  if(r<.38){S.pts+=1;return 'Ability Points+1';}

  const pool=['potion','potion','scroll','elixir','crystal','reset','rest','draught','reflex','tonic','incense','fortune','potion2'].filter(id=>cond(ITEMS[id].u||'lv>=1'));
  const id=pool[Math.floor(Math.random()*pool.length)];addItem(id,1);return ITEMS[id].n;

/* ----- jobs: the System decides ----- */
function scoreJob(j,bias){
  const P=S.perf,ps=Math.max(1,P.ph+P.st+P.rd+P.mi),ss=Math.max(1,STATS.reduce((a,k)=>a+S.stats[k],0));
  let sc=.5*(P[j.dom]||0)/ps+.5*(S.stats[j.p]||0)/ss;
  if(bias==='a'&&(j.dom==='ph'||j.p==='str'||j.p==='agi'||j.p==='vit'))sc+=.04;
  if(bias==='b'&&(j.dom!=='ph'||j.p==='int'||j.p==='per'))sc+=.04;
  if(j.kind==='sp')sc+=1;
  return sc;
}
function eligibleJobs(t){return JOBS.filter(j=>j.t===t&&!j.sec&&!j.fb&&cond(j.u));}
function decideJob(t,bias){
  const sec=JOBS.filter(j=>j.sec&&j.t===t&&cond(j.u));
  if(sec.length)return {j:sec[0],why:'A hidden condition was met.'};
  const el=eligibleJobs(t);
  if(!el.length)return {j:JOBS.find(j=>j.t===t&&j.fb),why:'No specialized class fits yet.'};
  let best=null,bs=-1;el.forEach(j=>{const s=scoreJob(j,bias);if(s>bs){bs=s;best=j;}});
  const why=best.kind==='sp'?'Your record matches a rare class.':'Highest fit: '+SN[best.p]+' and '+DN[best.dom]+' work.';
  return {j:best,why};
}
async function jobChange(t,bias){
  const {j,why}=decideJob(t,bias);
  S.job=j.id;S.jobHist.push(j.id);log('Job change: '+j.n+(j.sec?' (hidden)':''));save();render();
  await notice({lines:['Job change.',j.sec?'[Hidden job unlocked]':'The System has decided.','['+esc(j.n)+']']});
  await notice({lines:[esc(why),'Bonus: '+Object.entries(j.b).map(([k,v])=>'+'+v+' '+SN[k]).join(', ')]});
}

const qlabel=q=>({daily:'Daily Quest',special:'Special Quest',boss:'Weekly Boss',rankboss:'Rank Boss',gate:'Dungeon Gate',emergency:'Emergency Quest'})[q.type]||'Quest';
function weakDomains(){return [['st',20,60,'Study','min'],['rd',10,40,'Reading','pages'],['mi',5,20,'Meditation','min']].sort((a,b)=>S.perf[a[0]]-S.perf[b[0]]);}
function dailyQuest(day){
  const lv=S.level,s=Math.min(1,.2+.8*(lv-1)/39);
  const last=S.dh.slice(-7),rate=last.length>=3?last.filter(x=>x==='done').length/last.length:null;
  const adj=rate===null?1:rate>=.85?1.1:rate<.5?.8:1;
  const r5=n=>Math.max(10,Math.round(n/5)*5);
  const reps=Math.min(150,r5(100*s*adj)),km=Math.max(1,Math.min(15,Math.round(10*s*adj)));
  const goals=[{name:'Push-ups',target:reps,unit:'',cur:0},{name:'Sit-ups',target:reps,unit:'',cur:0},{name:'Squats',target:reps,unit:'',cur:0},{name:'Running',target:km,unit:'km',cur:0}];
  const notes=[];
  if(lv>=5){const wd=weakDomains();const n=lv>=20?2:1;
    for(let i=0;i<n;i++){const [d,lo,hi,label,u]=wd[i];goals.push({name:label,target:r5(lo+(hi-lo)*s),unit:u,cur:0,dom:d});}
    notes.push('Added by the System: '+wd.slice(0,n).map(x=>x[3]).join(' and ')+' (lowest in your record).');}
  if(adj>1)notes.push('Physical targets raised 10% after a strong week.');
  if(adj<1)notes.push('Physical targets eased 20% after a hard week.');
  return{id:'daily-'+day,type:'daily',title:'Strength Training',day,status:'active',penalty:true,dom:'ph',fr:.4,pts:3,loot:1,note:notes.join(' '),goals};
}

async function ensureDay(silent){
  if(!S.started||dayBusy)return;dayBusy=true;
  try{
    const today=dayKey();
    if(S.quests.some(q=>q.type==='daily')){S.quests=S.quests.filter(q=>q.type!=='daily');S.sel=0;save();render();}
    const now=Date.now();
    S.quests.forEach(q=>{if(q.status==='active'&&!q.ends)q.ends=now+864e5;});
    const fails=S.quests.filter(q=>q.status==='active'&&q.ends&&q.ends<=now);
    for(const q of fails)await failQuest(q);
    const wd=new Date().getDay(),spawned=[];
    for(const r of S.rec||[]){
      if(S.recDay[r.id]===today)continue;
      if(r.rep==='weekdays'&&(wd===0||wd===6))continue;
      if(activeSlots()>=8)continue;
      if(S.quests.some(x=>x.rec===r.id&&x.status==='active'))continue;
      S.quests.push(mkRecQuest(r,today));S.recDay[r.id]=today;spawned.push(r.title);
    }
    await spawnWeekly();
    if(spawned.length){save();render();if(!silent)await notice({lines:['Repeating quests have arrived.'].concat(spawned.map(t=>'['+esc(t)+']'))});}
  }finally{dayBusy=false;}
}
async function failQuest(q){

    else if(S.shield>0){S.shield--;lines.push('[Stealth] absorbed the penalty.');log(qlabel(q)+' failed: '+q.title+' (Stealth)');}
    else{const loss=Math.min(S.exp,Math.round(need(S.level)*.25*(1-penaltyRed())));S.exp-=loss;S.fat=Math.min(100,S.fat+25);S.hpR=Math.min(S.hpR,.5);
      lines.push('Penalty: EXP -'+loss,'Fatigue +25','HP reduced.');log(qlabel(q)+' failed: '+q.title+' (EXP -'+loss+', Fatigue +25)',true);}
  }else log(qlabel(q)+' failed: '+q.title,true);
  if(q.type==='emergency'&&q.loss){const l=Math.min(S.gold,q.loss*GX);S.gold-=l;if(l)lines.push('Gold -'+l.toLocaleString('en-US'));}

  await notice({lines,danger:true});

async function addProgress(q,gi,amt){
  const g=q.goals[gi];
  if(g.cap&&amt>0){const t=dayKey();if(g.dk!==t){g.dk=t;g.dn=0;}const room=Math.max(0,g.cap-(g.dn||0));
    if(room<=0){await notice({lines:['Daily limit reached for ['+esc(g.name)+'].','Rest. The rest of it waits for tomorrow.']});return;}
    if(amt>room){amt=room;await notice({lines:['Only '+fmt(room)+' more counts today for ['+esc(g.name)+'].']});}}
  const old=g.cur;g.cur=Math.max(0,Math.min(g.target,Math.round((g.cur+amt)*10)/10));
  if(g.cap)g.dn=Math.max(0,(g.dn||0)+(g.cur-old));
  save();render();
  if(q.status==='active'&&q.goals.every(x=>x.cur>=x.target))await completeQuest(q);
}

  const titles=P.map(r=>r.title).filter(Boolean);

      }
    };
  });
}

async function acceptChain(c){
  const st=S.ch[c.id]||{n:0};
  if(st.done)return;
  if(S.quests.some(q=>q.status==='active'&&q.chain===c.id)){await notice({lines:['This stage is already active.']});return;}
  const need_=c.min+3*st.n;
  if(S.level<need_){await notice({lines:['Locked.','Requires Level '+need_+'.']});return;}
  if(activeSlots()>=8){await notice({lines:['All 8 quest slots are in use.','Finish or remove a quest first.']});return;}
  const d=chainStage(c,st.n);
  const ok=await confirmDlg({lines:['['+esc(d.t)+']',d.goals.map(g=>esc(g.name)+' '+fmt(g.target)+esc(g.unit)).join(' · '),'Accept this quest?']});
  if(!ok)return;
  S.ch[c.id]=st;const q=mkChainQuest(c);S.quests.push(q);S.sel=qlist().indexOf(q);log('Quest accepted: '+q.title);save();ui.screen='quest';render();
  await notice({lines:['['+qlabel(q)+': '+esc(q.title)+' has arrived.]']});
}
async function acceptSpecial(sp){
  const st=S.sp[sp.id];
  if(!st){await notice({lines:['Locked.',esc(condText(sp.u))]});return;}
  if(st.done){await notice({lines:['Already completed.']});return;}
  if(S.quests.some(q=>q.status==='active'&&q.chain===sp.id)){await notice({lines:['This stage is already active.']});return;}
  if(activeSlots()>=8){await notice({lines:['All 8 quest slots are in use.','Finish or remove a quest first.']});return;}
  if(sp.fork&&!st.fork&&st.n===sp.stages.length){
    const c=await infoDlg('CHOOSE YOUR PATH','<p>The next stage branches. This choice shapes what follows'+(sp.jc?' and leans how the System judges you':'')+'.</p>',[['a',esc(sp.fork.a.l)],['b',esc(sp.fork.b.l)],['',"Not yet"]]);
    if(!c)return;st.fork=c;log('Path chosen: '+sp.fork[c].l);
  }
  const q=mkSpecialQuest(sp,st);
  const ok=await confirmDlg({lines:['['+esc(q.title)+']',q.goals.map(g=>esc(g.name)+' '+fmt(g.target)+esc(g.unit)).join(' · '),'Accept this quest?']});
  if(!ok)return;
  S.quests.push(q);S.sel=qlist().indexOf(q);log('Quest accepted: '+q.title);save();ui.screen='quest';render();
  await notice({lines:['['+qlabel(q)+': '+esc(q.title)+' has arrived.]']});
}

async function runCmd(txt){
  const t=txt.toLowerCase().trim();if(!t)return;
  for(const [re,k] of CMD){if(re.test(t)){
    if(k==='arise'){feedback('[Arise.]');await arise();return;}
    if(k==='army'&&!has('arise')){feedback('[That window is locked.]');return;}
    feedback('[Opening '+k.replace('pack','inventory')+' window.]');go(k);return;}}

let rvCtx=null;
function rvSound(tone){
  if(!S.snd)return;
  try{
    rvCtx=rvCtx||new (window.AudioContext||window.webkitAudioContext)();const c=rvCtx;if(c.state==='suspended')c.resume();
    const t=c.currentTime,m=c.createGain();m.gain.value=.55;m.connect(c.destination);
    // impact
    const nb=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const ns=c.createBufferSource();ns.buffer=nb;const nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=420;ns.connect(nf);nf.connect(m);ns.start(t);
    // sub boom
    const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(38,t+.7);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.connect(g);g.connect(m);o.start(t);o.stop(t+1.7);
    // drone swell
    const notes=tone==='aura'?[55,82.4,110]:tone==='ice'?[55,73.4,110]:[55,77.8,116.5];
    notes.forEach((f,i)=>{const dr=c.createOscillator(),dg=c.createGain(),lf=c.createBiquadFilter();dr.type='sawtooth';dr.frequency.value=f*(1+i*.002);lf.type='lowpass';lf.frequency.setValueAtTime(120,t);lf.frequency.linearRampToValueAtTime(tone==='aura'?900:500,t+3);
      dg.gain.setValueAtTime(0,t);dg.gain.linearRampToValueAtTime(.16,t+1.8);dg.gain.linearRampToValueAtTime(0,t+5);dr.connect(lf);lf.connect(dg);dg.connect(m);dr.start(t);dr.stop(t+5.2);});
  }catch(e){}
}
function reveal(key,{title,sub,tone='fear',ms=6000,shake=true}={}){
  return pushOv((root,close,setT)=>{
    const url=artUrl(key);
    root.innerHTML='<div class="rv '+tone+(shake&&!REDUCED?' shake':'')+'"><div class="rvim" style="background-image:url('+url+')"></div><div class="rvtint"></div><div class="rvvg"></div><div class="rvsl"></div><div class="rvfl"></div>'+
      '<div class="rvtx"><div class="rvtt">'+esc(title||'')+'</div>'+(sub?'<div class="rvst">'+sub+'</div>':'')+'<div class="rvtp">TAP TO CONTINUE</div></div></div>';
    const rv=root.querySelector('.rv');requestAnimationFrame(()=>rv.classList.add('on'));
    rvSound(tone);try{if(S.snd!==false&&navigator.vibrate)navigator.vibrate(tone==='fear'?[90,50,160,50,420]:[60,40,200]);}catch(e){}
    const t0=Date.now();let done=false;

  });
}

async function tickGates(){

    if(gateSeen.has(q.id))continue;
    const gt=q.gate;
    if(now>=gt.end&&now-gt.seen<=25000){gateSeen.add(q.id);q.goals[0].cur=q.goals[0].target;save();try{if(wakeLock)wakeLock.release();}catch(e){}await completeQuest(q);continue;}
    if(now-gt.seen>25000){gateSeen.add(q.id);q.note='You left the gate.';await failQuest(q);continue;}
    gt.seen=now;
    const cur=Math.min(q.goals[0].target,Math.round((now-gt.start)/6000)/10);
    if(cur!==q.goals[0].cur){q.goals[0].cur=cur;if(ui.screen==='quest'&&!$('#ov').classList.contains('on')&&Math.round((now-gt.start)/1000)%10===0)render();}
    if(Math.round((now-gt.start)/1000)%15===0)save();
  }
}

/* ---------- Android bridge: only active inside the Android app ---------- */
const CAP=window.Capacitor||null;
const NATIVE=!!(CAP&&typeof CAP.isNativePlatform==='function'&&CAP.isNativePlatform());
const PLG=n=>{try{return NATIVE&&CAP.Plugins&&CAP.Plugins[n]||null;}catch(e){return null;}};
const LN=()=>PLG('LocalNotifications');
const nid=(k,t)=>{let h=7;for(const c of k+':'+t)h=(h*33+c.charCodeAt(0))>>>0;return(h%2000000000)+1;};
const NIGHT=t=>{const h=new Date(t).getHours();return h>=22||h<7;};

/* ---- emergency quest plan: times are chosen ahead, so the phone can ring them while the app is closed ---- */
function planEmergencies(){
  const now=Date.now();let ch=false;
  if(S.emgOn===false){if(S.emgPlan&&S.emgPlan.length){S.emgPlan=[];ch=true;}if(ch)save();return;}
  S.emgPlan=S.emgPlan||[];S.emgPlanned=S.emgPlanned||{};
  const n0=S.emgPlan.length;S.emgPlan=S.emgPlan.filter(t=>t>now-25*6e4);if(S.emgPlan.length!==n0)ch=true;
  for(let d=0;d<3;d++){
    const day=new Date();day.setDate(day.getDate()+d);const key=dayKey(day);
    if(S.emgPlanned[key])continue;
    const mk=(a,b)=>{const x=new Date(day);x.setHours(a+Math.floor(Math.random()*(b-a)),Math.floor(Math.random()*60),0,0);return x.getTime();};
    [mk(10,14),mk(15,20)].forEach(t=>{if(t>now+20*6e4)S.emgPlan.push(t);});
    S.emgPlanned[key]=1;ch=true;
  }
  const old=dayKey(new Date(now-864e5));
  Object.keys(S.emgPlanned).forEach(k=>{if(k<old){delete S.emgPlanned[k];ch=true;}});
  S.emgPlan.sort((a,b)=>a-b);
  if(ch)save();
}
/* ---- every alert the phone should deliver, built from the current state ---- */
function buildAlertPlan(){
  const now=Date.now(),H=36e5,out=[];
  const add=(kind,t,title,body,extra,ch)=>{if(t>now+10000&&t<now+4*864e5&&!NIGHT(t))out.push({id:nid(kind,t),at:t,title,body,extra:Object.assign({kind:kind.replace(/[0-9a-z]{9,}$/,'')||kind},extra||{}),ch:ch||'system'});};
  for(const q of S.quests.filter(x=>x.status==='active'&&(x.ends||x.type==='daily'))){
    const ends=q.ends||endOfDay().getTime();
    const left=q.goals.filter(g=>g.cur<g.target).length;
    if(q.type==='daily'||(q.type==='custom'&&q.penalty)){
      [[3*H,'3 hours'],[H,'1 hour'],[15*6e4,'15 minutes']].forEach(([d,l])=>add('dl'+q.id,ends-d,'[SYSTEM]','['+q.title+'] '+l+' remaining. '+left+' goal'+(left===1?'':'s')+' unfinished.'));
    }else if(q.type==='boss'||q.type==='rankboss'){
      [[24*H,'24 hours'],[3*H,'3 hours']].forEach(([d,l])=>add('dl'+q.id,ends-d,'[SYSTEM]','['+q.title+'] '+l+' left. Do not let it escape.'));
    }
  }
  const open=S.quests.filter(x=>x.status==='active'&&!EXTT.includes(x.type)).length;
  for(let d=0;d<4;d++){
    const m=new Date();m.setDate(m.getDate()+d);m.setHours(8,0,0,0);
    add('am',m.getTime(),'[SYSTEM]','A new day begins. Your quests are waiting.');
    const e=new Date(m);e.setHours(19,0,0,0);
    add('pm',e.getTime(),'[SYSTEM]',d===0&&open?open+' quest'+(open===1?'':'s')+' still unfinished. The day is ending.':'Evening check. Have you cleared your quests today?');
  }
  if(S.level>=3){const m=new Date();m.setHours(8,5,0,0);m.setDate(m.getDate()+((8-m.getDay())%7||7));add('boss',m.getTime(),'[WEEKLY BOSS]','A new boss awaits this week. Open the System.');}
  (S.emgPlan||[]).forEach(t=>add('emg',t,'[EMERGENCY QUEST]','Something is happening. Open the System now.',{at:t},'emergency'));
  return out;
}
let alertT=null,alertBusy=false,alertAgain=false,alertSig='';
function scheduleAlerts(){if(!LN())return;clearTimeout(alertT);alertT=setTimeout(doSchedule,1500);}
async function doSchedule(){
  const ln=LN();if(!ln||!S.started)return;
  if(alertBusy){alertAgain=true;return;}alertBusy=true;
  try{
    planEmergencies();
    let plan=S.alerts?buildAlertPlan():[];
    plan.sort((a,b)=>a.at-b.at);plan=plan.slice(0,60);
    const sig=JSON.stringify(plan.map(p=>[p.id,p.body]));
    if(sig===alertSig)return;
    const ids=new Set((S.alertIds||[]).map(Number));
    try{const pend=await ln.getPending();((pend&&pend.notifications)||[]).forEach(n=>{if(n.extra&&n.extra.kind)ids.add(Number(n.id));});}catch(e){}
    if(ids.size)await ln.cancel({notifications:[...ids].map(id=>({id}))});
    if(plan.length)await ln.schedule({notifications:plan.map(p=>({id:p.id,title:p.title,body:p.body,channelId:p.ch,schedule:{at:new Date(p.at),allowWhileIdle:true},extra:p.extra,smallIcon:'ic_stat_system',iconColor:'#2F8CFF'}))});
    S.alertIds=plan.map(p=>p.id);alertSig=sig;
    window.__noAlertHook=true;save();window.__noAlertHook=false;
  }catch(e){}finally{alertBusy=false;if(alertAgain){alertAgain=false;scheduleAlerts();}}
}
async function nativeAskPerm(){
  const ln=LN();if(!ln)return false;
  try{
    let p=await ln.checkPermissions();
    if(p.display!=='granted')p=await ln.requestPermissions();
    return p.display==='granted';
  }catch(e){return false;}
}
async function nativeToggleAlerts(){
  if(S.alerts){S.alerts=false;save();scheduleAlerts();return;}
  const ok=await nativeAskPerm();S.alerts=ok;save();
  if(!ok)await notice({lines:['Alerts are blocked.','Allow notifications for The System','in your phone settings.']});
  alertSig='';scheduleAlerts();
}
async function testAlert(){
  const ln=LN();
  if(!ln){await notice({lines:['Background alerts need the Android app.','In the browser, alerts only arrive while the app is open.']});return;}
  if(!S.alerts){await notice({lines:['Phone alerts are off.','Turn them on first.']});return;}
  try{
    await ln.schedule({notifications:[{id:nid('test',Date.now()),title:'[SYSTEM]',body:'Test alert received. Alerts work.',channelId:'system',schedule:{at:new Date(Date.now()+15000),allowWhileIdle:true},smallIcon:'ic_stat_system',iconColor:'#2F8CFF'}]});
    await notice({lines:['Test alert in 15 seconds.','Close the app and lock your phone now.']});
  }catch(e){await notice({lines:['Could not schedule the test.'],danger:true});}
}
async function initNative(){
  const ln=LN();if(!ln)return;
  window.__alertHook=scheduleAlerts;
  try{await ln.createChannel({id:'system',name:'System alerts',description:'Quest reminders and warnings',importance:4,visibility:1,vibration:true,lights:true,lightColor:'#2F8CFF'});}catch(e){}
  try{await ln.createChannel({id:'emergency',name:'Emergency Quests',description:'Surprise timed challenges',importance:5,visibility:1,vibration:true});}catch(e){}
  try{ln.addListener('localNotificationActionPerformed',()=>{setTimeout(()=>maybeEmergency(),700);});}catch(e){}
  if(!S.alertsAsked){
    S.alertsAsked=1;save();
    await notice({lines:['The System needs permission','to send you alerts.','Allow notifications on the next screen.'],ms:3600});
    S.alerts=await nativeAskPerm();save();render();
  }
  try{const ex=await ln.checkExactNotificationSetting();
    if(S.alerts&&ex&&ex.exact_alarm==='denied'&&!S.exactAsked){S.exactAsked=1;save();
      await notice({lines:['Allow exact alarms','so alerts arrive on time.','Switch it on in the next screen.'],ms:3600});
      try{await ln.changeExactNotificationSetting();}catch(e){}}}catch(e){}
  alertSig='';scheduleAlerts();
}

function promptText(title,hint,val){
  return pushOv((root,close)=>{
    root.innerHTML='<div class="ovstage"><div class="pd open"><div class="pd-title">'+esc(title)+'</div><p>'+esc(hint)+'</p><textarea id="ptx" rows="7" style="width:100%;background:#02060d;color:#fff;border:1px solid var(--b);padding:8px;font:12px monospace;user-select:text;-webkit-user-select:text">'+esc(val||'')+'</textarea><div class="pd-btns"><button class="btnbox" data-v="1">OK</button><button class="btnbox" data-v="0">Cancel</button></div></div></div>';
    sfx.open();root.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;close(b.dataset.v==='1'?($('#ptx').value||''):null);};
  });
}
const backupPack=()=>JSON.stringify({app:'the-system',v:1,at:new Date().toISOString(),data:S});
async function exportBackup(){
  const name='the-system-backup-'+dayKey()+'.json';
  try{
    S.lastBackup=Date.now();save();
    const text=backupPack(),FS=PLG('Filesystem'),SH=PLG('Share');
    if(NATIVE&&FS&&SH){
      const r=await FS.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
      await SH.share({title:'The System backup',text:'My System progress',url:r.uri,dialogTitle:'Save your backup (Drive, Files, ...)'});
    }else{
      const blob=new Blob([text],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    }
    log('Backup exported: '+name);save();render();
    await notice({lines:['Backup ready.','['+esc(name)+']','Keep it somewhere safe, like Google Drive.']});
  }catch(e){
    if(/cancel/i.test(String(e&&(e.message||e))))return;
    await notice({lines:['Backup failed.','Try [Copy backup text] instead.'],danger:true});
  }
}
async function copyBackup(){
  const text=backupPack();
  try{await navigator.clipboard.writeText(text);S.lastBackup=Date.now();save();render();await notice({lines:['Backup text copied.','Paste it into a note or message to yourself.','Use [Paste backup text] to restore it.']});}
  catch(e){S.lastBackup=Date.now();save();await promptText('BACKUP TEXT','Select all, copy, and keep it somewhere safe.',text);}
}
async function restoreFromText(txt){
  let d;
  try{const j=JSON.parse(txt);d=j&&j.data?j.data:j;}catch(e){await notice({lines:['This cannot be read.','It is not a valid backup.'],danger:true});return;}
  if(!d||typeof d!=='object'||typeof d.level!=='number'||!Array.isArray(d.quests)||typeof d.stats!=='object'){await notice({lines:['This is not a System backup.','Nothing was changed.'],danger:true});return;}
  const ok=await confirmDlg({lines:['Load this backup?','Level '+d.level+' · '+((d.totals&&d.totals.done)||0)+' quests cleared','Your current progress will be replaced.']});
  if(!ok)return;
  try{localStorage.setItem(KEY+'_prev',JSON.stringify(S));}catch(e){}
  window.__noSave=true;
  try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){window.__noSave=false;await notice({lines:['Could not restore.','Storage is full or blocked.'],danger:true});return;}
  location.reload();
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json,text/plain';
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;await restoreFromText(await f.text());};
  inp.click();
}
async function pasteBackup(){
  const t=await promptText('PASTE BACKUP','Paste the backup text you copied earlier.','');
  if(t)await restoreFromText(t);
}
async function backupNag(){
  if(!S.started||(S.totals&&S.totals.done<5))return;
  const since=Date.now()-(S.lastBackup||S.startedAt||Date.now());
  if(since<7*864e5||S.bkNag===dayKey())return;
  S.bkNag=dayKey();save();
  await notice({lines:['[SYSTEM]',S.lastBackup?'Your last backup was '+Math.floor(since/864e5)+' days ago.':'You have never made a backup.','Open Settings and tap Export backup.']});
}
async function postBoot(){
  try{await initNative();}catch(e){}
  try{await backupNag();}catch(e){}
}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  if(!S.started){
    render();
    await alarm('[WELCOME,<br><span class="g">PLAYER</span>.]',3000);
    let ok=false;
    while(!ok)ok=await confirmDlg({lines:['Your heart will stop in <span class="rd">0.02 seconds</span>','if you choose not to accept.','Will you accept?']});
    S.started=true;S.tick=Date.now();S.startedAt=Date.now();log('Registered as a Player.');
    await ensureDay(true);ui.screen='quest';S.sel=0;save();render();
    postBoot();await checkAll();return;
  }
  regen();render();await ensureDay(false);await checkAll();
}
let warnBusy=false;
async function checkWarn(){
  if(!S.started||warnBusy)return;
  const q=S.quests.find(x=>x.type==='daily'&&x.status==='active');if(!q)return;
  const left=Math.floor((endOfDay()-Date.now())/1000);
  if(S.warned.day!==q.day)S.warned={day:q.day,n:[]};
  const TH=[[21600,'6 hours'],[10800,'3 hours'],[3600,'1 hour'],[900,'15 minutes']];
  const passed=TH.filter(([s])=>left<=s&&!S.warned.n.includes(s));
  if(!passed.length)return;
  passed.forEach(([s])=>S.warned.n.push(s));save();
  const [s,label]=passed[passed.length-1];
  warnBusy=true;
  try{
    const left_=q.goals.filter(g=>g.cur<g.target).length;
    sysNotify('[SYSTEM]','Daily Quest: '+label+' remaining.');
    if(!$('#ov').classList.contains('on')){
      if(quiet()){/* silent in quiet hours */}
      await notice({lines:['[Daily Quest: '+label+' remaining.]',left_+' goal'+(left_===1?'':'s')+' unfinished.'],danger:s<=3600});
    }
  }finally{warnBusy=false;}
}
setInterval(()=>{updateTL();tickGates();},1000);
setInterval(()=>{if(!S.started)return;regen();if(ui.screen==='status'&&!$('#ov').classList.contains('on'))render();ensureDay(false).then(checkWarn);maybeEmergency();save();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.started){regen();render();ensureDay(false).then(checkWarn).then(checkAll);maybeEmergency();scheduleAlerts();}});
new ResizeObserver(fitAll).observe($('#stage'));
boot();setTimeout(()=>{if(S.started)postBoot();},1200);

if(!NATIVE && 'serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
