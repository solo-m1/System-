name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project if uploaded as a single zip
        run: |
          if [ ! -f package.json ] && [ -f the-system-android.zip ]; then
            unzip -q the-system-android.zip -d _proj
            shopt -s dotglob
            cp -r _proj/*/* . 2>/dev/null || cp -r _proj/* .
          fi
          ls
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: App icons
        run: npx capacitor-assets generate --android --assetPath assets
        continue-on-error: true
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-system-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
