name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip if needed
        run: |
          if [ ! -f package.json ] && [ -f the-system-android.zip ]; then
            unzip -q the-system-android.zip -d _proj
            shopt -s dotglob
            cp -r _proj/*/* . 2>/dev/null || cp -r _proj/* .
          fi
          ls -la
          test -f package.json
          test -f www/index.html
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icons
        run: npx capacitor-assets generate --android --assetPath assets
        continue-on-error: true
      - name: Patch Android project
        run: |
          mkdir -p android-signing
          [ -f android-signing/app.keystore ] || keytool -genkeypair -keystore android-signing/app.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=The System"
          cat > p.js <<'JSEOF'
          const fs=require('fs');
          const mf='android/app/src/main/AndroidManifest.xml';
          let m=fs.readFileSync(mf,'utf8');
          for(const p of ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE','WAKE_LOCK'])
            if(!m.includes('permission.'+p+'"'))m=m.replace('</manifest>','<uses-permission android:name="android.permission.'+p+'"/></manifest>');
          fs.writeFileSync(mf,m);
          const gf='android/app/build.gradle';
          let g=fs.readFileSync(gf,'utf8');
          g=g.replace(/android\s*\{/,x=>x+'\nsigningConfigs{thesystem{storeFile file("../../android-signing/app.keystore")\nstorePassword "android"\nkeyAlias "androiddebugkey"\nkeyPassword "android"}}\n');
          g=g.replace(/buildTypes\s*\{/,x=>x+'\ndebug{signingConfig signingConfigs.thesystem}\n');
          fs.writeFileSync(gf,g);
          const d='android/app/src/main/res/drawable';
          fs.mkdirSync(d,{recursive:true});
          fs.writeFileSync(d+'/ic_stat_system.xml','<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,2L21,6V12C21,17 17,21 12,22C7,21 3,17 3,12V6Z"/></vector>');
          JSEOF
          node p.js
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-system-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
